<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Party — @The Guandi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Great Vibes (微草寫) 與 Cormorant Garamond (高級復古襯線體) -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f6f0ea; /* 復古米色紙張背景 */
            color: #2c221e;
        }
        .script-font {
            font-family: 'Great Vibes', cursive;
        }
        .serif-font {
            font-family: 'Cormorant Garamond', serif;
        }
        .retro-card {
            background-color: #fbf8f5;
            border: 1px solid #e7dcd1;
            box-shadow: 0 10px 30px rgba(120, 90, 70, 0.08);
        }
        .grid-btn {
            background: #f4ece4;
            border: 1px solid #d9ccbe;
            color: #2c221e;
            transition: all 0.2s ease;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }
        .grid-btn:hover {
            background: #a3333d;
            color: #ffffff;
            border-color: #a3333d;
        }
        .info-section {
            background: #fbf8f5;
            border: 1px solid #e7dcd1;
        }
        .action-btn {
            background-color: #a3333d;
            color: #ffffff;
            transition: all 0.2s ease;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 0.08em;
        }
        .action-btn:hover {
            background-color: #822831;
        }
        /* 倒數進度條外框與特效 */
        .countdown-bar-container {
            background-color: #f0e6dc;
            border: 1px solid #d9ccbe;
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            height: 24px;
        }
        .countdown-bar-fill {
            background: linear-gradient(90deg, #a3333d 0%, #c2414d 100%);
            height: 100%;
            width: 0%;
            transition: width 1s linear;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 relative overflow-x-hidden">

    <!-- 主要容器 -->
    <main class="w-full max-w-md relative z-10 flex flex-col space-y-6 pb-16 pt-4">
        
        <!-- 頂部副標題 (微草寫質感) -->
        <div class="text-center text-xl sm:text-2xl text-[#a3333d] script-font font-normal tracking-wide">
            ~ Naughty or Nice? ~
        </div>

        <!-- 主視覺封面圖片 -->
        <div class="retro-card rounded-2xl p-2 sm:p-3 shadow-xl overflow-hidden text-center">
            <img src="./IMG_3838.jpeg" alt="Christmas Party Invitation" class="w-full h-auto rounded-xl shadow-sm border border-[#e7dcd1]">
        </div>

        <!-- ⏳ 動態倒數計時與 Progress Bar 區塊 -->
        <div class="retro-card rounded-xl p-4 text-center shadow-sm space-y-2.5">
            <div class="script-font text-2xl text-[#a3333d] font-normal">
                Countdown to Party
            </div>
            <!-- 倒數數字顯示 -->
            <div id="countdown-timer" class="serif-font text-lg sm:text-xl font-semibold italic text-[#5c4a42] tracking-wide">
                計算中...
            </div>
            <!-- 進度條 Bar -->
            <div class="countdown-bar-container w-full shadow-inner">
                <div id="countdown-bar" class="countdown-bar-fill"></div>
            </div>
        </div>

        <!-- 📅 加入 Google 行事曆按鈕 -->
        <div class="text-center">
            <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Christmas+Party+%40The+Guandi&dates=20261219T100000Z/20261219T160000Z&details=%E5%A5%BD%E5%8F%8B%E6%B4%BE%E5%B0%8D%E6%AD%A1%E8%BF%8E%E5%85%89%E8%87%A8%EF%BC%81&location=111%E8%87%BA%E5%8C%97%E5%B8%82%E5%A3%AB%E6%9E%97%E5%8D%80%E7%A6%8F%E6%9E%97%E9%87%8C%E4%B8%AD%E5%B1%B1%E5%8C%97%E8%B7%AF%E4%BA%94%E6%AE%B5476%E8%B2%938%E6%A8%93%E4%B9%8B8B1" 
               target="_blank" 
               class="action-btn w-full py-3 px-4 rounded-xl shadow-sm text-sm font-semibold tracking-wider uppercase flex items-center justify-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span class="serif-font text-base italic tracking-widest">Add to Google Calendar</span>
            </a>
        </div>

        <!-- 👇 Google 試算表 A 欄動態生成的導覽按鈕區塊 -->
        <div id="dynamic-menu-grid" class="grid grid-cols-2 gap-2.5 pt-1">
            <div class="col-span-full text-center text-xs text-[#7a685e] font-mono py-3">
                Loading menu from Sheets...
            </div>
        </div>

        <!-- 👇 下方詳細資訊區塊 -->
        <div id="details-container" class="space-y-4 pt-2">
            <!-- 動態載入的詳細資訊 -->
        </div>

        <!-- 頁尾資訊 -->
        <div class="text-center text-xs text-[#8c786d] serif-font italic pt-4">
            Looking forward to celebrating with you.
        </div>
    </main>

    <!-- 倒數計時、進度條與試算表串接腳本 -->
    <script>
        // ⏳ 倒數計時與進度條邏輯 (設定一個基準總天數，例如距離派對 90 天前開始計算進度)
        const targetDate = new Date('2026-12-19T18:00:00').getTime();
        const startDate = new Date('2026-09-20T00:00:00').getTime(); // 基準起始日

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const timerElem = document.getElementById('countdown-timer');
            const barElem = document.getElementById('countdown-bar');

            if (distance < 0) {
                timerElem.innerHTML = "Party has started! 🎉";
                if (barElem) barElem.style.width = '100%';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            timerElem.innerHTML = `${days} days ${hours} hrs ${minutes} mins ${seconds} secs`;

            // 計算進度條百分比 (隨時間推進增加)
            const totalDuration = targetDate - startDate;
            const elapsed = now - startDate;
            let percentage = (elapsed / totalDuration) * 100;
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;

            if (barElem) {
                barElem.style.width = percentage + '%';
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 📊 Google 試算表資料串接
        const apiURL = 'https://script.google.com/macros/s/AKfycbyxG_hOTI6X2bCDWVs3y62peCIqg52U9EMGDbpEysqdfu6MiEFSFFb9ZN9mqJ0eb3vf/exec';

        const giftColors = [
            { box: '#a3333d', ribbon: '#f1c40f' }, 
            { box: '#27ae60', ribbon: '#e74c3c' }, 
            { box: '#2980b9', ribbon: '#f39c12' }, 
            { box: '#8e44ad', ribbon: '#2ecc71' }, 
            { box: '#d35400', ribbon: '#3498db' }, 
            { box: '#16a085', ribbon: '#f39c12' }  
        ];

        fetch(apiURL)
            .then(response => response.json())
            .then(data => {
                const btnContainer = document.getElementById('dynamic-menu-grid');
                const detailsContainer = document.getElementById('details-container');
                
                btnContainer.innerHTML = '';
                detailsContainer.innerHTML = '';
                
                if (!data || data.length === 0) {
                    btnContainer.innerHTML = '<div class="col-span-full text-center text-xs text-[#7a685e]">No records found</div>';
                    return;
                }

                let sectionsMap = {};
                let sectionOrder = [];
                let currentCategory = '';

                data.forEach((item) => {
                    let colA = item.a !== undefined ? item.a : (Object.keys(item).length > 0 ? item[Object.keys(item)[0]] : '');
                    let colB = item.b !== undefined ? item.b : (Object.keys(item).length > 1 ? item[Object.keys(item)[1]] : '');
                    
                    colA = colA ? String(colA).trim() : '';
                    colB = colB ? String(colB).trim() : '';
                    
                    if (colA) {
                        currentCategory = colA;
                        if (!sectionsMap[currentCategory]) {
                            sectionsMap[currentCategory] = [];
                            sectionOrder.push(currentCategory);
                        }
                    }

                    if (currentCategory && colB) {
                        sectionsMap[currentCategory].push(colB);
                    }
                });

                sectionOrder.forEach((cat, index) => {
                    const contents = sectionsMap[cat];
                    const anchorId = 'section-' + index;
                    const colorScheme = giftColors[index % giftColors.length];

                    // 1. 上方 A 欄選項按鈕
                    const btn = document.createElement('a');
                    btn.href = `#${anchorId}`;
                    btn.className = 'grid-btn p-3 rounded-lg text-center flex items-center justify-center min-h-[46px] shadow-sm';
                    btn.innerHTML = `<span class="serif-font italic text-base">${cat}</span>`;
                    btnContainer.appendChild(btn);

                    // 2. 下方資訊區塊
                    const sectionCard = document.createElement('div');
                    sectionCard.id = anchorId;
                    sectionCard.className = 'info-section rounded-xl p-4 shadow-sm scroll-mt-6';
                    
                    const giftSvg = `
                        <svg class="w-5 h-5 inline-block mr-2 -mt-0.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 12V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V12H20Z" fill="${colorScheme.box}" stroke="#2c221e" stroke-width="1.5"/>
                            <path d="M2 7H22V12H2V7Z" fill="${colorScheme.box}" stroke="#2c221e" stroke-width="1.5"/>
                            <path d="M12 7V22" stroke="${colorScheme.ribbon}" stroke-width="2"/>
                            <path d="M2 9.5H22" stroke="${colorScheme.ribbon}" stroke-width="1.5"/>
                            <path d="M12 7C12 5.34315 10.6569 4 9 4C7.34315 4 6 5.34315 6 7C6 8.65685 9 10 12 7Z" fill="${colorScheme.ribbon}" stroke="#2c221e" stroke-width="1.5"/>
                            <path d="M12 7C12 5.34315 13.3431 4 15 4C16.6569 4 18 5.34315 18 7C18 8.65685 15 10 12 7Z" fill="${colorScheme.ribbon}" stroke="#2c221e" stroke-width="1.5"/>
                        </svg>
                    `;

                    let contentHtml = `<h3 class="script-font text-2xl text-[#a3333d] mb-2 pb-1 border-b border-[#ebdcd0] flex items-center">${giftSvg}<span class="ml-1">${cat}</span></h3>`;
                    contentHtml += `<div class="space-y-1.5 text-xs text-[#5c4a42] font-mono leading-relaxed pl-7">`;
                    contents.forEach(line => {
                        contentHtml += `<div class="py-0.5">${line}</div>`;
                    });
                    contentHtml += `</div>`;

                    // 💡 Location 區塊自動帶入地圖圖片與 Google 導航按鈕
                    if (cat.toLowerCase().includes('location')) {
                        contentHtml += `
                            <div class="mt-3 pt-2 pl-7 space-y-3">
                                <img src="./531100AE-D9AF-4E38-84B3-9E091DD39747.png" alt="Location Map" class="w-full h-auto rounded-lg shadow-sm border border-[#e7dcd1]">
                                <a href="https://maps.app.goo.gl/yoBPjXKwwhUPjyoN6?g_st=ic" 
                                   target="_blank" 
                                   class="action-btn w-full py-2.5 px-4 rounded-xl shadow-sm text-xs font-semibold tracking-widest uppercase flex items-center justify-center space-x-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    </svg>
                                    <span class="serif-font italic text-sm tracking-widest">Open Google Maps</span>
                                </a>
                            </div>
                        `;
                    }

                    sectionCard.innerHTML = contentHtml;
                    detailsContainer.appendChild(sectionCard);
                });
            })
            .catch(error => {
                console.error('Failed to load sheet data:', error);
                document.getElementById('dynamic-menu-grid').innerHTML = '<div class="col-span-full text-center text-xs text-red-600">Error loading database</div>';
            });
    </script>
</body>
</html>
