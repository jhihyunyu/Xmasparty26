<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Party — @The Guandi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f6f0ea; /* 復古米色紙張背景 */
            color: #2c221e;
        }
        .serif-font {
            font-family: 'Cormorant Garamond', serif;
        }
        .retro-card {
            background-color: #fbf8f5;
            border: 1px solid #e7dcd1;
            box-shadow: 0 10px 30px rgba(120, 90, 70, 0.08);
        }
        .ribbon-text {
            color: #a3333d; /* 手繪紅 */
        }
        .grid-btn {
            background: #f4ece4;
            border: 1px solid #d9ccbe;
            color: #2c221e;
            transition: all 0.2s ease;
        }
        .grid-btn:hover {
            background: #a3333d;
            color: #ffffff;
            border-color: #a3333d;
        }
        .info-section {
            background: #fbf8f5;
            border: 1px solid #e7dcd1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 relative overflow-x-hidden">

    <!-- 主要容器 -->
    <main class="w-full max-w-md relative z-10 flex flex-col space-y-6 pb-16 pt-4">
        
        <!-- 頂部副標題 -->
        <div class="text-center text-xs tracking-widest text-[#a3333d] uppercase serif-font italic font-medium">
            ~ Naughty or Nice? ~
        </div>

        <!-- 主視覺邀請函卡片（蠟筆畫風格華麗聖誕樹） -->
        <div class="retro-card rounded-2xl p-6 sm:p-8 relative overflow-hidden text-center">
            
            <!-- 裝飾性頂部蝴蝶結示意 -->
            <div class="flex justify-between items-center px-2 mb-1 text-[#a3333d] opacity-80">
                <span class="serif-font text-lg">❦</span>
                <span class="text-xs font-mono tracking-widest uppercase">Christmas Party</span>
                <span class="serif-font text-lg">❦</span>
            </div>

            <!-- 標題：Christmas Party -->
            <div class="my-2">
                <h1 class="serif-font text-4xl sm:text-5xl font-semibold italic ribbon-text tracking-wide leading-tight">
                    Christmas Party
                </h1>
            </div>

            <!-- 華麗蠟筆畫風格聖誕樹 (SVG 藝術創作) -->
            <div class="my-5 flex justify-center">
                <svg class="w-40 h-40 sm:w-48 sm:h-48 drop-shadow-md" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- 樹幹 -->
                    <rect x="92" y="155" width="16" height="30" fill="#5c3a21" rx="2"/>
                    <!-- 樹身層疊 (粉彩蠟筆多層次綠色) -->
                    <path d="M100 15 L140 65 H125 L155 105 H140 L175 150 H25 L60 150 H45 L75 105 H60 L85 65 H70 L100 15Z" fill="#315c44" stroke="#1e3a2b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="1 1"/>
                    <path d="M100 25 L130 65 H115 L145 105 H130 L160 145 H40 L70 145 H55 L85 105 H70 L100 65 H85 L100 25Z" fill="#3e7357" opacity="0.85"/>
                    
                    <!-- 華麗閃耀的蠟筆彩球與燈飾（多種繽紛色彩） -->
                    <circle cx="100" cy="50" r="5" fill="#e056fd" stroke="#fff" stroke-width="1"/>
                    <circle cx="85" cy="85" r="5.5" fill="#f0932b" stroke="#fff" stroke-width="1"/>
                    <circle cx="115" cy="90" r="5" fill="#eb4d4b" stroke="#fff" stroke-width="1"/>
                    <circle cx="68" cy="125" r="6" fill="#686de0" stroke="#fff" stroke-width="1"/>
                    <circle cx="132" cy="120" r="5.5" fill="#f6e58d" stroke="#fff" stroke-width="1"/>
                    <circle cx="95" cy="130" r="5" fill="#ff7979" stroke="#fff" stroke-width="1"/>
                    <circle cx="110" cy="110" r="4.5" fill="#badc58" stroke="#fff" stroke-width="1"/>
                    <circle cx="80" cy="105" r="4" fill="#7ed6df" stroke="#fff" stroke-width="1"/>
                    <circle cx="125" cy="140" r="5" fill="#ffbe76" stroke="#fff" stroke-width="1"/>

                    <!-- 華麗樹頂金色大星星 -->
                    <path d="M100 4 L104 13 H113 L106 18 L108 27 L100 22 L92 27 L94 18 L87 13 H96 Z" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1.5"/>
                </svg>
            </div>

            <!-- 時間與日期資訊 -->
            <div class="my-4 py-2 border-t border-b border-[#ebdcd0]">
                <p class="serif-font text-base sm:text-lg tracking-wider text-[#5c4a42]">
                    December &nbsp;|&nbsp; 19th &nbsp;|&nbsp; 18:00-24:00
                </p>
            </div>

            <!-- 地點資訊 -->
            <div class="mt-3 space-y-1">
                <div class="serif-font text-lg font-semibold text-[#a3333d] tracking-wide">
                    @The Guandi
                </div>
                <div class="text-[11px] text-[#7a685e] leading-relaxed px-2 font-light">
                    111臺北市士林區福林里中山北路五段476號8樓之8B1
                </div>
            </div>
        </div>

        <!-- 👇 Google 試算表 A 欄動態生成的導覽按鈕區塊（已保留） -->
        <div id="dynamic-menu-grid" class="grid grid-cols-2 gap-2.5 pt-1">
            <div class="col-span-full text-center text-xs text-[#7a685e] font-mono py-3">
                Loading menu...
            </div>
        </div>

        <!-- 👇 下方詳細資訊區塊（以 A 欄為標題、B 欄為內容，前方帶有不同顏色的禮物盒圖示） -->
        <div id="details-container" class="space-y-4 pt-2">
            <!-- 動態載入的詳細資訊會呈現在這裡 -->
        </div>

        <!-- 頁尾資訊 -->
        <div class="text-center text-[11px] text-[#8c786d] serif-font italic pt-4">
            Looking forward to celebrating with you.
        </div>
    </main>

    <!-- Google 試算表資料串接與互動腳本 -->
    <script>
        const apiURL = 'https://script.google.com/macros/s/AKfycbyxG_hOTI6X2bCDWVs3y62peCIqg52U9EMGDbpEysqdfu6MiEFSFFb9ZN9mqJ0eb3vf/exec';

        // 預先準備一組繽紛各異的禮物盒圖示與色彩組合
        const giftColors = [
            { box: '#a3333d', ribbon: '#f1c40f' }, // 紅身金帶
            { box: '#27ae60', ribbon: '#e74c3c' }, // 綠身紅帶
            { box: '#2980b9', ribbon: '#f39c12' }, // 藍身黃帶
            { box: '#8e44ad', ribbon: '#2ecc71' }, // 紫身綠帶
            { box: '#d35400', ribbon: '#3498db' }, // 橘身藍帶
            { box: '#16a085', ribbon: '#f39c12' }  // 青身黃帶
        ];

        fetch(apiURL)
            .then(response => response.json())
            .then(data => {
                const btnContainer = document.getElementById('dynamic-menu-grid');
                const detailsContainer = document.getElementById('details-container');
                
                btnContainer.innerHTML = '';
                detailsContainer.innerHTML = '';
                
                if (!data || data.length === 0) {
                    btnContainer.innerHTML = '<div class="col-span-full text-center text-xs text-[#7a685e]">No records found</div>';
                    return;
                }

                // 處理資料：以 A 欄作為分類，將對應的 B 欄內容歸納進去
                let sectionsMap = {};
                let sectionOrder = [];
                let currentCategory = '';

                data.forEach((item) => {
                    let colA = item.a ? item.a.trim() : '';
                    let colB = item.b ? item.b.trim() : '';
                    
                    if (colA) {
                        currentCategory = colA;
                        if (!sectionsMap[currentCategory]) {
                            sectionsMap[currentCategory] = [];
                            sectionOrder.push(currentCategory);
                        }
                    }

                    if (currentCategory && colB) {
                        sectionsMap[currentCategory].push(colB);
                    }
                });

                // 產生上方按鈕與下方詳細資訊卡片
                sectionOrder.forEach((cat, index) => {
                    const contents = sectionsMap[cat];
                    const anchorId = 'section-' + index;
                    const colorScheme = giftColors[index % giftColors.length];

                    // 1. 上方 A 欄選項按鈕 (點擊後平滑捲動)
                    const btn = document.createElement('a');
                    btn.href = `#${anchorId}`;
                    btn.className = 'grid-btn p-3 rounded-lg text-center flex items-center justify-center min-h-[46px] shadow-sm text-xs font-semibold uppercase tracking-wider';
                    btn.innerHTML = `<span>${cat}</span>`;
                    btnContainer.appendChild(btn);

                    // 2. 下方資訊區塊 (以 A 欄為標題，B 欄為內容列表)
                    const sectionCard = document.createElement('div');
                    sectionCard.id = anchorId;
                    sectionCard.className = 'info-section rounded-xl p-4 shadow-sm scroll-mt-6';
                    
                    const giftSvg = `
                        <svg class="w-5 h-5 inline-block mr-2 -mt-0.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 12V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V12H20Z" fill="${colorScheme.box}" stroke="#2c221e" stroke-width="1.5"/>
                            <path d="M2 7H22V12H2V7Z" fill="${colorScheme.box}" stroke="#2c221e" stroke-width="1.5"/>
                            <path d="M12 7V22" stroke="${colorScheme.ribbon}" stroke-width="2"/>
                            <path d="M2 9.5H22" stroke="${colorScheme.ribbon}" stroke-width="1.5"/>
                            <path d="M12 7C12 5.34315 10.6569 4 9 4C7.34315 4 6 5.34315 6 7C6 8.65685 9 10 12 7Z" fill="${colorScheme.ribbon}" stroke="#2c221e" stroke-width="1.5"/>
                            <path d="M12 7C12 5.34315 13.3431 4 15 4C16.6569 4 18 5.34315 18 7C18 8.65685 15 10 12 7Z" fill="${colorScheme.ribbon}" stroke="#2c221e" stroke-width="1.5"/>
                        </svg>
                    `;

                    let contentHtml = `<h3 class="serif-font text-base font-semibold text-[#a3333d] mb-2.5 pb-1 border-b border-[#ebdcd0] tracking-wide flex items-center">${giftSvg}<span>${cat}</span></h3>`;
                    contentHtml += `<div class="space-y-1.5 text-xs text-[#5c4a42] font-mono leading-relaxed pl-7">`;
                    contents.forEach(line => {
                        contentHtml += `<div class="py-0.5">${line}</div>`;
                    });
                    contentHtml += `</div>`;

                    sectionCard.innerHTML = contentHtml;
                    detailsContainer.appendChild(sectionCard);
                });
            })
            .catch(error => {
                console.error('Failed to load sheet data:', error);
                document.getElementById('dynamic-menu-grid').innerHTML = '<div class="col-span-full text-center text-xs text-red-600">Error loading database</div>';
            });
    </script>
</body>
</html>
