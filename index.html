<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAKING 31 — CONFIDENTIAL CASE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0b131d;
            color: #f8fafc;
        }
        .chem-box {
            background-color: #14532d;
            color: white;
            font-family: monospace;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem 0.5rem;
            border: 1px solid #22c55e;
        }
        .chem-box-sm {
            background-color: #14532d;
            color: white;
            font-family: monospace;
            font-size: 0.65rem;
            padding: 0.1rem 0.3rem;
            border: 1px solid #22c55e;
            display: inline-block;
        }
        .grid-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            transition: all 0.2s;
        }
        .grid-btn:hover {
            border-color: #22c55e;
            background: rgba(20, 83, 45, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 relative overflow-x-hidden">

    <!-- 背景暗色濾鏡與質感 -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-[#0b131d] to-black opacity-85 pointer-events-none"></div>

    <!-- 主要容器 -->
    <main class="w-full max-w-md relative z-10 flex flex-col space-y-4 pb-12">
        
        <!-- 頂部標題資訊 -->
        <div class="text-center text-xs tracking-widest text-slate-400 uppercase py-1">
            BREAKING 31 — CONFIDENTIAL CASE...
        </div>

        <!-- 主視覺卡片 -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-2xl relative overflow-hidden backdrop-blur-md">
            
            <!-- 仿絕命毒師元素的標題 -->
            <div class="text-center my-4">
                <div class="flex items-center justify-center space-x-1.5 text-4xl sm:text-5xl font-extrabold tracking-tight mb-2">
                    <span class="chem-box text-2xl sm:text-3xl">31</span>
                    <span class="text-white">Br</span>
                    <span class="text-slate-300 font-light">eaking</span>
                </div>
                <div class="flex items-center justify-center space-x-1.5 text-3xl sm:text-4xl font-extrabold tracking-tight">
                    <span class="chem-box text-xl sm:text-2xl">11.6</span>
                    <span class="text-white">31</span>
                </div>
            </div>

            <!-- 機密標籤 -->
            <div class="flex justify-center my-3">
                <span class="bg-red-950/80 text-red-400 border border-red-600/60 text-[10px] tracking-widest px-3 py-0.5 font-mono uppercase transform -rotate-1 shadow-sm">
                    TOP SECRET ・ EYES ONLY
                </span>
            </div>

            <!-- 副標題與資訊 -->
            <div class="text-center space-y-2 my-4">
                <p class="text-xs font-mono text-emerald-400 tracking-wider">
                    A PRIVATE NIGHT SHIFT // TAIPEI, TAIWAN
                </p>
                
                <div class="grid grid-cols-2 gap-2 pt-2">
                    <div class="border border-slate-700 bg-slate-950/50 p-2 text-center rounded">
                        <div class="text-[10px] text-slate-500 font-mono">DATE</div>
                        <div class="text-xs font-mono text-slate-200">FRIDAY ・ 06 NOV 2026</div>
                    </div>
                    <div class="border border-slate-700 bg-slate-950/50 p-2 text-center rounded">
                        <div class="text-[10px] text-slate-500 font-mono">TIME</div>
                        <div class="text-xs font-mono text-slate-200">20:00 — 08:00</div>
                    </div>
                </div>

                <div class="border border-slate-700 bg-slate-950/50 p-2 text-left rounded">
                    <div class="text-[10px] text-slate-500 font-mono">LOCATION</div>
                    <div class="text-xs font-mono text-slate-200">官邸 the GUANDI</div>
                </div>
            </div>

            <!-- 狀態標題 -->
            <div class="text-center pt-2 pb-1">
                <h2 class="text-sm font-mono tracking-widest text-emerald-400 font-bold uppercase">
                    OPERATION IN PROGRESS
                </h2>
            </div>
        </div>

        <!-- 👇 Google 試算表 A 欄動態生成的方框按鈕區塊 -->
        <div id="dynamic-menu-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 pt-2">
            <!-- 載入中提示 -->
            <div class="col-span-full text-center text-xs text-slate-500 font-mono py-4">
                LOADING DATABASE FROM SHEETS...
            </div>
        </div>

        <!-- 頁尾資訊 -->
        <div class="text-center text-[10px] text-slate-600 font-mono pt-4">
            ♪ BREAKING BAD — MAIN TITLE THEME
        </div>
    </main>

    <!-- Google 試算表資料串接與方框自動生成腳本 -->
    <script>
        // 已直接代入你的 Google Apps Script 網頁應用程式 URL
        const apiURL = 'https://script.google.com/macros/s/AKfycbw6H859dFasP_R75w_k6ZcQWcW-E8c-w3z5T2qP7vK8a2c2m7k9x0v8n3m1/exec';

        fetch(apiURL)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('dynamic-menu-grid');
                container.innerHTML = ''; // 清空載入中提示
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center text-xs text-slate-500 font-mono">NO RECORDS FOUND</div>';
                    return;
                }

                data.forEach((item, index) => {
                    const btn = document.createElement('a');
                    btn.href = `#${item.title.toLowerCase()}`;
                    btn.className = 'grid-btn p-3 rounded text-center flex items-center justify-center min-h-[44px] shadow-sm';
                    btn.innerHTML = `<span class="text-xs font-mono tracking-wider text-slate-200 font-semibold uppercase">${item.title}</span>`;
                    container.appendChild(btn);
                });
            })
            .catch(error => {
                console.error('Failed to load sheet data:', error);
                document.getElementById('dynamic-menu-grid').innerHTML = '<div class="col-span-full text-center text-xs text-red-500 font-mono">ERROR LOADING DATABASE</div>';
            });
    </script>
</body>
</html>
