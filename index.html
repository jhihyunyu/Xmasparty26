<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Party — @The Guandi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f6f0ea; /* 復古米色紙張背景 */
            color: #2c221e;
        }
        .serif-font {
            font-family: 'Cormorant Garamond', serif;
        }
        .retro-card {
            background-color: #fbf8f5;
            border: 1px solid #e7dcd1;
            box-shadow: 0 10px 30px rgba(120, 90, 70, 0.08);
        }
        .ribbon-text {
            color: #a3333d; /* 手繪紅 */
        }
        .tree-green {
            color: #4a6b5d; /* 復古聖誕綠 */
        }
        .grid-btn {
            background: #f4ece4;
            border: 1px solid #d9ccbe;
            color: #2c221e;
            transition: all 0.2s ease;
        }
        .grid-btn:hover {
            background: #a3333d;
            color: #ffffff;
            border-color: #a3333d;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 relative overflow-x-hidden">

    <!-- 主要容器 -->
    <main class="w-full max-w-md relative z-10 flex flex-col space-y-5 pb-12 pt-4">
        
        <!-- 頂部副標題 -->
        <div class="text-center text-xs tracking-widest text-[#a3333d] uppercase serif-font italic font-medium">
            ~ Naughty or Nice? ~
        </div>

        <!-- 主視覺邀請函卡片 -->
        <div class="retro-card rounded-2xl p-6 sm:p-8 relative overflow-hidden text-center">
            
            <!-- 裝飾性頂部手繪感蝴蝶結示意 -->
            <div class="flex justify-between items-center px-2 mb-2 text-[#a3333d] opacity-80">
                <span class="serif-font text-lg">❦</span>
                <span class="text-xs font-mono tracking-widest uppercase">Christmas Party</span>
                <span class="serif-font text-lg">❦</span>
            </div>

            <!-- 標題：Christmas Party -->
            <div class="my-4">
                <h1 class="serif-font text-4xl sm:text-5xl font-semibold italic ribbon-text tracking-wide leading-tight">
                    Christmas Party
                </h1>
            </div>

            <!-- 聖誕樹小圖示 / 裝飾 -->
            <div class="my-4 flex justify-center">
                <div class="w-12 h-12 rounded-full bg-[#f0e6dc] flex items-center justify-center tree-green shadow-inner">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                    </svg>
                </div>
            </div>

            <!-- 時間與日期資訊 (對應圖片中的格式) -->
            <div class="my-4 py-2 border-t border-b border-[#ebdcd0]">
                <p class="serif-font text-base sm:text-lg tracking-wider text-[#5c4a42]">
                    December &nbsp;|&nbsp; 19th &nbsp;|&nbsp; 18:00-24:00
                </p>
            </div>

            <!-- 地點資訊 -->
            <div class="mt-4 space-y-1">
                <div class="serif-font text-lg font-semibold text-[#a3333d] tracking-wide">
                    @The Guandi
                </div>
                <div class="text-[11px] text-[#7a685e] leading-relaxed px-2 font-light">
                    111臺北市士林區福林里中山北路五段476號8樓之8B1
                </div>
            </div>
        </div>

        <!-- 👇 Google 試算表資料動態生成的方框按鈕區塊 -->
        <div id="dynamic-menu-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 pt-2">
            <!-- 載入中提示 -->
            <div class="col-span-full text-center text-xs text-[#7a685e] font-mono py-4">
                Loading invitation details...
            </div>
        </div>

        <!-- 頁尾資訊 -->
        <div class="text-center text-[11px] text-[#8c786d] serif-font italic pt-2">
            Looking forward to celebrating with you.
        </div>
    </main>

    <!-- Google 試算表資料串接與方框自動生成腳本 -->
    <script>
        const apiURL = 'https://script.google.com/macros/s/AKfycbyxG_hOTI6X2bCDWVs3y62peCIqg52U9EMGDbpEysqdfu6MiEFSFFb9ZN9mqJ0eb3vf/exec';

        fetch(apiURL)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('dynamic-menu-grid');
                container.innerHTML = ''; // 清空載入中提示
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center text-xs text-[#7a685e]">No records found</div>';
                    return;
                }

                data.forEach((item) => {
                    const keys = Object.keys(item);
                    const textValue = keys.length > 0 ? item[keys[0]] : '';

                    const btn = document.createElement('a');
                    btn.href = `#${textValue ? String(textValue).trim().toLowerCase() : ''}`;
                    btn.className = 'grid-btn p-3 rounded-lg text-center flex items-center justify-center min-h-[46px] shadow-sm text-xs font-medium tracking-wide';
                    btn.innerHTML = `<span>${textValue || ''}</span>`;
                    container.appendChild(btn);
                });
            })
            .catch(error => {
                console.error('Failed to load sheet data:', error);
                document.getElementById('dynamic-menu-grid').innerHTML = '<div class="col-span-full text-center text-xs text-red-600">Error loading database</div>';
            });
    </script>
</body>
</html>
